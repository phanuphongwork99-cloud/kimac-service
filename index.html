<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMAC Service Sheet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Sarabun', sans-serif; background: #f0f2f5; color: #1a1a2e; }
        
        /* สไตล์ปุ่ม Export */
        .topbar { background: #1a1a2e; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,.3); }
        .topbar-logo { display: flex; align-items: center; gap: 12px; color: #fff; }
        .btn-pdf { background: #e8c547; color: #1a1a2e; border: none; padding: 9px 20px; border-radius: 6px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 7px; }

        /* ขนาดกระดาษ A4 สำหรับการ Export */
        .main { max-width: 860px; margin: 24px auto; padding: 0 16px 40px; }
        .a4-container { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.07); }

        .card { border: 1px solid #eee; border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
        .card-header { background: #1a1a2e; color: #fff; padding: 10px 18px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .card-body { padding: 16px 18px; }

        .form-row { display: grid; gap: 12px; margin-bottom: 12px; grid-template-columns: repeat(2, 1fr); }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-size: 12px; font-weight: 600; color: #888; }
        
        input, select, textarea { border: 1.5px solid #e2e2ec; border-radius: 7px; padding: 9px 12px; font-family: 'Sarabun'; font-size: 14px; outline: none; background: #fafafa; }
        
        /* ส่วนของตารางอะไหล่ */
        .parts-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .parts-table th { background: #1a1a2e; color: #fff; padding: 8px; font-size: 12px; text-align: center; }
        .parts-table td { border: 1px solid #eee; padding: 5px; }
        .parts-table input { width: 100%; border: none; background: transparent; text-align: center; }

        /* ส่วนของลายเซ็น */
        .sig-wrapper { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .sig-box { border: 2px dashed #ccc; background: #fcfcfc; border-radius: 8px; position: relative; height: 120px; }
        canvas { width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
        .btn-clear { font-size: 11px; color: red; cursor: pointer; background: none; border: none; margin-top: 5px; }

        .total-box { margin-left: auto; width: 250px; background: #f8f8fd; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .total-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
        .grand-total { font-weight: bold; color: #1a1a2e; border-top: 1px solid #ddd; padding-top: 5px; }

        @media (max-width: 600px) {
            .form-row, .sig-wrapper { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-logo">
        <strong>KIMAC</strong> <span>SERVICE SHEET</span>
    </div>
    <button class="btn-pdf" onclick="exportPDF()">
        💾 ดาวน์โหลด PDF
    </button>
</div>

<div class="main" id="pdf-content">
    <div class="a4-container">
        <div class="card">
            <div class="card-header">ข้อมูลลูกค้าและบริการ</div>
            <div class="card-body">
                <div class="form-row">
                    <div class="field">
                        <label>ประเภทงาน</label>
                        <select id="job_type">
                            <option>ติดตั้งเครื่องจักร</option>
                            <option>ซ่อมบำรุง (PM)</option>
                            <option>อื่นๆ</option>
                        </select>
                    </div>
                    <div class="field"><label>วันที่บริการ</label><input type="date"></div>
                </div>
                <div class="form-row">
                    <div class="field"><label>บริษัทลูกค้า</label><input type="text" placeholder="ชื่อบริษัท"></div>
                    <div class="field"><label>NO.JOB</label><input type="text" placeholder="K-XXXX"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">ข้อมูลเครื่องจักร</div>
            <div class="card-body">
                <div class="form-row">
                    <div class="field">
                        <label>สถานที่บริการ</label>
                        <select>
                            <option>หน้างานลูกค้า (On-site)</option>
                            <option>บจก.คีแมค (In-house)</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>สถานะการรับประกัน</label>
                        <select id="warranty_status" onchange="checkWarranty()">
                            <option value="out">นอกการรับประกัน</option>
                            <option value="in">ในการรับประกัน</option>
                        </select>
                    </div>
                </div>
                <div class="field" id="warranty_no_div" style="display:none; margin-top:10px;">
                    <label>เลขที่รับประกัน</label>
                    <input type="text" id="s_warranty_no" placeholder="กรอกเลขที่รับประกัน">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">รายการอะไหล่และค่าบริการ</div>
            <div class="card-body" style="padding:0">
                <table class="parts-table">
                    <thead>
                        <tr>
                            <th style="width:50%">รายการอะไหล่</th>
                            <th>จำนวน</th>
                            <th>ราคา/หน่วย</th>
                            <th>รวม</th>
                        </tr>
                    </thead>
                    <tbody id="parts-body">
                        <script>
                            for(let i=1; i<=5; i++){
                                document.write(`
                                    <tr>
                                        <td><input type="text"></td>
                                        <td><input type="number" class="qty" oninput="calculate()"></td>
                                        <td><input type="number" class="price" oninput="calculate()"></td>
                                        <td class="row-total">0.00</td>
                                    </tr>
                                `);
                            }
                        </script>
                    </tbody>
                </table>
                <div class="total-box">
                    <div class="total-row"><span>ค่าบริการ:</span> <input type="number" id="service_fee" value="0" oninput="calculate()" style="width:80px; text-align:right;"></div>
                    <div class="total-row"><span>VAT 7%:</span> <span id="t_vat">0.00</span></div>
                    <div class="total-row grand"><span>รวมสุทธิ:</span> <span id="t_grand">0.00</span></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">การยืนยันและลายเซ็น</div>
            <div class="card-body">
                <div class="sig-wrapper">
                    <div class="field">
                        <label>ลงชื่อลูกค้า / ผู้ตรวจรับ</label>
                        <div class="sig-box"><canvas id="canvas-client"></canvas></div>
                        <button class="btn-clear" onclick="clearSig('canvas-client')">ล้างลายเซ็น</button>
                    </div>
                    <div class="field">
                        <label>ลงชื่อช่างผู้ให้บริการ</label>
                        <div class="sig-box"><canvas id="canvas-tech"></canvas></div>
                        <button class="btn-clear" onclick="clearSig('canvas-tech')">ล้างลายเซ็น</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. ฟังก์ชันเปิด-ปิดช่องประกัน
    function checkWarranty() {
        const status = document.getElementById('warranty_status').value;
        const div = document.getElementById('warranty_no_div');
        div.style.display = (status === 'in') ? 'block' : 'none';
    }

    // 2. ฟังก์ชันคำนวณเงิน
    function calculate() {
        let totalParts = 0;
        const rows = document.querySelectorAll('#parts-body tr');
        rows.forEach(row => {
            const qty = row.querySelector('.qty').value || 0;
            const price = row.querySelector('.price').value || 0;
            const sub = qty * price;
            row.querySelector('.row-total').innerText = sub.toFixed(2);
            totalParts += sub;
        });

        const serviceFee = parseFloat(document.getElementById('service_fee').value) || 0;
        const totalBeforeVat = totalParts + serviceFee;
        const vat = totalBeforeVat * 0.07;
        const grand = totalBeforeVat + vat;

        document.getElementById('t_vat').innerText = vat.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('t_grand').innerText = grand.toLocaleString(undefined, {minimumFractionDigits: 2});
    }

    // 3. ระบบลายเซ็น (Canvas)
    function setupSignature(canvasId) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext("2d");
        let drawing = false;

        // ปรับขนาด canvas ให้ตรงกับที่แสดงผลจริง
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX || e.touches[0].clientX) - rect.left,
                y: (e.clientY || e.touches[0].clientY) - rect.top
            };
        }

        function start(e) { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }
        function move(e) {
            if (!drawing) return;
            e.preventDefault();
            const p = getPos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        }
        function end() { drawing = false; }

        canvas.addEventListener("mousedown", start);
        canvas.addEventListener("mousemove", move);
        canvas.addEventListener("mouseup", end);
        canvas.addEventListener("touchstart", start);
        canvas.addEventListener("touchmove", move);
        canvas.addEventListener("touchend", end);
    }

    function clearSig(id) {
        const canvas = document.getElementById(id);
        canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
    }

    // 4. ฟังก์ชัน Export PDF (ดาวน์โหลดแทนการปริ้น)
    function exportPDF() {
        const element = document.getElementById('pdf-content');
        const opt = {
            margin: 5,
            filename: 'KIMAC_Service_Sheet.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    window.onload = () => {
        setupSignature('canvas-client');
        setupSignature('canvas-tech');
    };
</script>

</body>
</html>
