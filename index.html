<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIMAC Service Sheet - A4 Version</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');

:root {
    --primary: #4a90e2;
    --text: #333;
    --border: #ccc;
    --bg-light: #f9f9f9;
}

* { box-sizing: border-box; -webkit-print-color-adjust: exact; }

body { 
    font-family: 'Sarabun', sans-serif; 
    background: #e0e0e0; 
    margin: 0; 
    padding: 0; 
    color: var(--text);
}

/* ตั้งค่าขนาด A4 */
.page {
    width: 210mm;
    min-height: 297mm;
    padding: 15mm;
    margin: 10mm auto;
    background: white;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    position: relative;
}

@media print {
    body { background: none; }
    .page { margin: 0; box-shadow: none; width: 210mm; height: 297mm; }
    .no-print { display: none !important; }
}

.header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }
.logo-text { color: var(--primary); font-weight: 700; font-size: 22px; letter-spacing: 1px; }

.section-title { 
    background: var(--bg-light); 
    padding: 8px 12px; 
    font-weight: 600; 
    border-left: 4px solid var(--primary); 
    margin: 15px 0 10px;
    font-size: 14px;
}

.grid-row { display: grid; gap: 15px; margin-bottom: 15px; }
.col-4 { grid-template-columns: repeat(4, 1fr); }
.col-2 { grid-template-columns: repeat(2, 1fr); }

.field label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 4px; }
.field input, .field select, .field textarea { 
    width: 100%; 
    padding: 8px; 
    border: 1px solid var(--border); 
    border-radius: 4px; 
    font-family: 'Sarabun'; 
    font-size: 13px;
    outline: none;
}

.parts-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
.parts-table th { background: #f2f2f2; border: 1px solid var(--border); padding: 8px; font-size: 13px; text-align: left; }
.parts-table td { border: 1px solid var(--border); padding: 5px; }
.parts-table input { width: 100%; border: none; padding: 5px; font-family: 'Sarabun'; }

.summary-box { width: 250px; margin-left: auto; margin-top: 20px; }
.sum-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px; }
.total { color: var(--primary); font-weight: 700; border-top: 1px solid var(--border); margin-top: 5px; padding-top: 5px; }

.signature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 30px; text-align: center; }
.sig-box { border: 1px dashed var(--border); height: 120px; position: relative; background: #fff; }
canvas { width: 100%; height: 100%; touch-action: none; }

.btn-floating { 
    position: fixed; bottom: 30px; right: 30px; 
    background: var(--primary); color: white; border: none; 
    padding: 15px 25px; border-radius: 50px; font-weight: 600; 
    cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
    z-index: 1000;
}
</style>
</head>
<body>

<button class="btn-floating no-print" onclick="window.print()">บันทึกเป็น PDF (A4)</button>

<div class="page" id="form-content">
    <div class="header-flex">
        <div class="logo-text">KIMAC SERVICE SHEET</div>
        <div style="text-align: right; font-size: 12px;">
            <div id="display-date"></div>
            <strong>No. JOB:</strong> <input type="text" style="border:none; border-bottom:1px solid #ccc; width: 100px;">
        </div>
    </div>

    <div class="section-title">ข้อมูลลูกค้าและประเภทงาน</div>
    <div class="grid-row col-2">
        <div class="field">
            <label>ประเภทงานบริการ</label>
            <select id="job-type">
                <option value="fix">ติดตั้งเครื่องจักร</option>
                <option value="pm">ซ่อมบำรุง (PM)</option>
                <option value="repair">งานซ่อม (Repair)</option>
                <option value="other">อื่นๆ</option>
            </select>
        </div>
        <div class="field">
            <label>สถานที่บริการ</label>
            <select id="location">
                <option value="onsite">On-site (หน้างานลูกค้า)</option>
                <option value="office">In-house (ซ่อมที่ศูนย์)</option>
                <option value="online">Online Support</option>
            </select>
        </div>
    </div>

    <div class="grid-row col-2">
        <div class="field">
            <label>สถานะการรับประกัน</label>
            <select id="warranty-status" onchange="toggleWarrantyInput()">
                <option value="none">ไม่อยู่ในการรับประกัน</option>
                <option value="active">อยู่ในระยะรับประกัน</option>
            </select>
        </div>
        <div class="field" id="warranty-no-field" style="display: none;">
            <label>หมายเลขประกัน (Warranty No.)</label>
            <input type="text" id="warranty-no" placeholder="กรอกเลขประกัน">
        </div>
    </div>

    <div class="grid-row col-1">
        <div class="field"><label>ชื่อลูกค้า / บริษัท</label><input type="text"></div>
    </div>

    <div class="section-title">รายการอะไหล่ / วัสดุสิ้นเปลือง</div>
    <table class="parts-table">
        <thead>
            <tr>
                <th style="width: 50%;">รายการ</th>
                <th style="width: 15%;">จำนวน</th>
                <th style="width: 35%;">ราคา/หน่วย</th>
            </tr>
        </thead>
        <tbody id="parts-body"></tbody>
    </table>

    <div class="summary-box">
        <div class="sum-row">
            <span>ค่าบริการ</span>
            <input type="number" id="t_sub" value="0" oninput="calcTotal()" style="width: 100px; text-align: right;">
        </div>
        <div class="sum-row">
            <span>ภาษีมูลค่าเพิ่ม (7%)</span>
            <span id="t_vat">0.00</span>
        </div>
        <div class="sum-row total">
            <span>ยอดสุทธิรวม</span>
            <span id="t_grand">0.00</span>
        </div>
    </div>

    <div class="section-title">ยืนยันการปฏิบัติงาน (ไม่มีหมายเหตุ)</div>
    <div class="signature-grid">
        <div>
            <label style="font-size: 12px; color: #666;">ลายเซ็นลูกค้า</label>
            <div class="sig-box">
                <canvas id="sig-client"></canvas>
            </div>
            <button class="no-print" onclick="clearSig('sig-client')" style="font-size: 10px; margin-top: 5px;">ล้าง</button>
        </div>
        <div>
            <label style="font-size: 12px; color: #666;">ลายเซ็นช่างบริการ</label>
            <div class="sig-box">
                <canvas id="sig-tech"></canvas>
            </div>
            <button class="no-print" onclick="clearSig('sig-tech')" style="font-size: 10px; margin-top: 5px;">ล้าง</button>
        </div>
    </div>
</div>

<script>
// จัดการแสดงผลช่องเลขประกัน
function toggleWarrantyInput() {
    const status = document.getElementById('warranty-status').value;
    document.getElementById('warranty-no-field').style.display = (status === 'active') ? 'block' : 'none';
}

// คำนวณเงิน
function calcTotal() {
    let serviceFee = parseFloat(document.getElementById('t_sub').value) || 0;
    let partsSum = 0;
    document.querySelectorAll('.p-row').forEach(row => {
        let q = parseFloat(row.querySelector('.p-qty').value) || 0;
        let p = parseFloat(row.querySelector('.p-price').value) || 0;
        partsSum += (q * p);
    });
    let total = serviceFee + partsSum;
    let vat = total * 0.07;
    let grand = total + vat;
    document.getElementById('t_vat').innerText = vat.toLocaleString(undefined, {minimumFractionDigits:2});
    document.getElementById('t_grand').innerText = grand.toLocaleString(undefined, {minimumFractionDigits:2});
}

// สร้างตาราง
const tbody = document.getElementById('parts-body');
for(let i=0; i<6; i++) {
    tbody.innerHTML += `
        <tr class="p-row">
            <td><input type="text"></td>
            <td><input type="number" class="p-qty" oninput="calcTotal()"></td>
            <td><input type="number" class="p-price" oninput="calcTotal()"></td>
        </tr>`;
}

// ระบบลายเซ็น 2 ช่อง
function initSig(id) {
    const canvas = document.getElementById(id);
    const ctx = canvas.getContext('2d');
    let drawing = false;

    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
    canvas.addEventListener('mousemove', (e) => { 
        if(!drawing) return; 
        const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); 
    });
    window.addEventListener('mouseup', () => drawing = false);
    
    canvas.addEventListener('touchstart', (e) => { 
        drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); e.preventDefault();
    }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { 
        if(!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault();
    }, {passive: false});
}

function clearSig(id) {
    const canvas = document.getElementById(id);
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}

window.onload = () => {
    initSig('sig-client');
    initSig('sig-tech');
    document.getElementById('display-date').innerText = "วันที่: " + new Date().toLocaleDateString('th-TH');
};
</script>
</body>
</html>
