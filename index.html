<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERVICE SHEET - KIMAC</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Sarabun', sans-serif;
    background: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    font-size: 13px;
  }
  .btn-export {
    margin-bottom: 15px;
    padding: 10px 28px;
    background: #1a3a6e;
    color: white;
    border: none;
    border-radius: 6px;
    font-family: 'Sarabun', sans-serif;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-export:hover { background: #122d57; }
  
  /* CSS สำหรับการพิมพ์ */
  @media print {
    body { background: white; padding: 0; }
    .btn-export { display: none; }
    .page { box-shadow: none; margin: 0; width: 210mm; height: 297mm; }
    .sig-trigger-btn { display: none !important; }
    .sig-preview-img { display: block !important; }
    .btn-add-row { display: none !important; }
  }

  /* ปรับแต่งสำหรับ Desktop (A4) */
  .page {
    width: 210mm;
    min-height: 297mm;
    background: #ffffff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    padding: 5mm 8mm 4mm 8mm;
    position: relative;
  }

  /* --- Mobile Responsive Fix --- */
  @media screen and (max-width: 768px) {
    body { padding: 10px; }
    .page {
      width: 100%;
      height: auto;
      padding: 15px;
    }
    .header {
      flex-direction: column;
      text-align: center;
      gap: 10px;
    }
    .header-right {
      text-align: center;
      min-width: 100%;
    }
    .job-no-box input {
      width: 100%;
    }
    .sig-section {
      flex-direction: column;
    }
    .status-block {
      width: 100%;
    }
    .parts-table {
      display: block;
      overflow-x: auto; /* เลื่อนตารางแนวนอนได้ถ้ามือถือแคบมาก */
    }
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid #1a3a6e;
    padding-bottom: 3px;
    margin-bottom: 4px;
  }
  .header-logo-wrap { display: flex; flex-direction: column; align-items: center; }
  .header-logo { width: 90px; height: 70px; object-fit: contain; }
  .header-logo-sub { font-size: 9px; font-weight: 700; color: #1a3a6e; letter-spacing: 1px; text-align: center; margin-top: 2px; white-space: nowrap; }
  .header-center { text-align: center; flex: 1; }
  .header-center h1 { font-size: 20px; font-weight: 700; color: #1a3a6e; letter-spacing: 2px; }
  .header-center p { font-size: 11px; color: #555; }
  .header-right { text-align: right; min-width: 90px; }
  .job-no-box { border: 2px solid #1a3a6e; border-radius: 4px; padding: 4px 8px; background: white; margin-top: 4px; }
  .job-no-box label { font-size: 10px; color: #666; display: block; }
  .job-no-box input { border: none; background: transparent; font-family: 'Sarabun', sans-serif; font-size: 13px; font-weight: 700; color: #1a3a6e; width: 90px; outline: none; text-align: center; }
  .service-type-bar { background: #fff9c4; border: 1px solid #f9c900; border-radius: 4px; padding: 2px 8px; margin-bottom: 3px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .service-type-bar span { font-weight: 600; color: #1a3a6e; white-space: nowrap; }
  .service-type-bar select { border: 1px solid #bfa000; border-radius: 4px; background: white; font-family: 'Sarabun', sans-serif; font-size: 13px; padding: 2px 8px; outline: none; cursor: pointer; color: #222; }
  .other-input { border: none; border-bottom: 1px solid #aaa; background: transparent; font-family: 'Sarabun', sans-serif; font-size: 13px; width: 200px; outline: none; display: none; }
  .other-input.show { display: inline-block; }
  .section-title { background: #1a3a6e; color: white; padding: 2px 8px; font-weight: 700; font-size: 11px; border-radius: 3px; margin-bottom: 3px; margin-top: 4px; }
  .form-row { display: flex; gap: 6px; margin-bottom: 3px; align-items: center; flex-wrap: wrap; }
  .field { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 200px; }
  .field label { white-space: nowrap; color: #444; font-weight: 600; font-size: 12px; }
  .field input, .field select, .field textarea { flex: 1; border: none; border-bottom: 1px solid #bfa000; background: transparent; font-family: 'Sarabun', sans-serif; font-size: 13px; padding: 1px 4px; outline: none; color: #222; min-width: 60px; }
  .field select { border: 1px solid #bfa000; border-radius: 4px; background: white; padding: 2px 4px; cursor: pointer; }
  .field textarea { resize: none; border: 1px solid #bfa000; border-radius: 4px; background: rgba(255,255,255,0.7); padding: 4px; width: 100%; font-size: 13px; line-height: 1.6; }
  .full-width { width: 100%; flex: unset; }
  .status-row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 3px; }
  .status-block { display: flex; align-items: center; gap: 8px; background: #fff9c4; border: 1px solid #f9c900; border-radius: 4px; padding: 2px 8px; flex-wrap: wrap; }
  .status-block label { font-weight: 600; color: #1a3a6e; font-size: 12px; white-space: nowrap; }
  .radio-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .radio-group label { display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; font-weight: 400; color: #333; }
  .radio-group input[type=radio] { width: 14px; height: 14px; accent-color: #1a3a6e; cursor: pointer; }
  .warranty-input { border: none; border-bottom: 1px solid #bfa000; background: transparent; font-family: 'Sarabun', sans-serif; font-size: 13px; width: 160px; outline: none; display: none; }
  .warranty-input.show { display: inline-block; }
  .parts-table { width: 100%; border-collapse: collapse; margin-bottom: 3px; font-size: 12px; }
  .parts-table th { background: #1a3a6e; color: white; padding: 3px 4px; text-align: center; font-size: 11px; font-weight: 600; }
  .parts-table td { border: 1px solid #d4c000; padding: 2px 4px; background: white; }
  .parts-table td input { width: 100%; border: none; background: transparent; font-family: 'Sarabun', sans-serif; font-size: 11px; outline: none; text-align: center; }
  .parts-table td:first-child { text-align: center; width: 24px; background: #fff9c4; font-weight: 600; color: #1a3a6e; }
  .parts-table td:nth-child(2) input { text-align: left; }
  .parts-table .price-cell input { text-align: right; }
  .parts-table .total-label { text-align: right; font-weight: 700; background: #fff9c4; color: #1a3a6e; padding-right: 8px; border: 1px solid #d4c000; }
  .parts-table .total-val { text-align: right; background: #fffde0; font-weight: 700; color: #c00; border: 1px solid #d4c000; padding-right: 6px; min-width: 80px; }
  .province-input { border: none; border-bottom: 1px solid #bfa000; background: transparent; font-family: 'Sarabun', sans-serif; font-size: 12px; width: 110px; outline: none; display: none; color: #222; }
  .province-input.show { display: inline-block; }
  .sig-section { clear: both; display: flex; gap: 10px; margin-top: 3px; margin-bottom: 3px; }
  .sig-box { flex: 1; border: 1.5px solid #1a3a6e; border-radius: 6px; padding: 4px 8px 4px; background: white; text-align: center; }
  .sig-box .sig-title { font-size: 12px; font-weight: 700; color: #1a3a6e; margin-bottom: 4px; }
  .sig-preview-wrap {
    position: relative;
    width: 100%;
    height: 45px;
    border: 1px dashed #bfa000;
    border-radius: 4px;
    background: #f8f8f8;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sig-preview-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
    position: absolute;
    top: 0; left: 0;
  }
  .sig-trigger-btn {
    font-size: 11px;
    color: #555;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Sarabun', sans-serif;
    padding: 4px 8px;
    display: flex;
    align-items: center;
    gap: 4px;
    z-index: 1;
  }
  .sig-meta { display: flex; gap: 6px; margin-top: 2px; font-size: 11px; align-items: center; flex-wrap: wrap; }
  .sig-meta label { color: #555; font-size: 11px; white-space: nowrap; }
  .sig-meta input { border: none; border-bottom: 1px solid #bfa000; background: transparent; font-family: 'Sarabun', sans-serif; font-size: 11px; flex: 1; outline: none; min-width: 50px; }
  .btn-clear-sig { font-size: 10px; padding: 2px 6px; border: 1px solid #999; border-radius: 3px; background: #eee; cursor: pointer; font-family: 'Sarabun', sans-serif; margin-top: 3px; }
  .sig-modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 9999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .sig-modal-overlay.open { display: flex; }
  .sig-modal-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: #1a3a6e;
    color: white;
  }
  .sig-modal-title { font-family: 'Sarabun', sans-serif; font-size: 15px; font-weight: 700; color: white; }
  .sig-modal-body {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: white;
  }
  .sig-modal-hint { font-family: 'Sarabun', sans-serif; font-size: 13px; color: #888; margin-bottom: 10px; }
  .sig-modal-canvas-wrap {
    width: 100%;
    max-width: 560px;
    border: 2px dashed #bfa000;
    border-radius: 8px;
    background: #fafafa;
    overflow: hidden;
  }
  #sigModalCanvas { display: block; width: 100%; touch-action: none; cursor: crosshair; background: #fafafa; }
  .sig-modal-footer {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .sig-modal-btn { padding: 10px 28px; font-family: 'Sarabun', sans-serif; font-size: 14px; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; }
  .sig-modal-btn.confirm { background: #1a3a6e; color: white; }
  .sig-modal-btn.clear { background: #eee; color: #333; border: 1px solid #bbb; }
  .sig-modal-btn.cancel { background: #c00; color: white; }
  .rating-section { background: #fff9c4; border: 1px solid #f9c900; border-radius: 5px; padding: 3px 8px; margin-bottom: 3px; font-size: 11px; }
  .rating-section p { color: #555; margin-bottom: 2px; }
  .rating-stars { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .rating-stars label { display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; color: #333; }
  .rating-stars input[type=radio] { width: 14px; height: 14px; accent-color: #f9a800; cursor: pointer; }
  .feedback-area { margin-top: 2px; }
  .feedback-area label { font-size: 11px; color: #666; }
  .feedback-area textarea { width: 100%; height: 30px; resize: none; border: 1px solid #d4c000; border-radius: 3px; background: rgba(255,255,255,0.7); font-family: 'Sarabun', sans-serif; font-size: 12px; padding: 2px 5px; outline: none; }
  .footer { text-align: center; border-top: 2px solid #1a3a6e; padding-top: 3px; color: #1a3a6e; font-size: 10px; line-height: 1.5; }
  .footer .thank-you { font-size: 13px; font-weight: 700; color: #1a3a6e; margin-bottom: 3px; }
  .footer .company-name { font-size: 12px; font-weight: 700; color: #1a3a6e; }
  .footer .contact { color: #444; font-size: 11px; }
  .btn-add-row {
    display: inline-block;
    margin-bottom: 3px;
    padding: 3px 12px;
    background: #1a3a6e;
    color: white;
    border: none;
    border-radius: 4px;
    font-family: 'Sarabun', sans-serif;
    font-size: 11px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-add-row:hover { background: #122d57; }
</style>
</head>
